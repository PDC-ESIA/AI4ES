services:
  adk:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    environment:
      - UV_PROJECT_ENVIRONMENT=/venv
    command: >
      sh -c "uv sync --no-dev && uv run uvicorn app.main:app --host 0.0.0.0 --port 8081"
    ports:
      - "8081:8081"
    env_file:
      - .env
    volumes:
      - .:/app:ro
      - adk-venv-docker:/venv
      - copilot-tokens:/root/.config/litellm/github_copilot
    restart: unless-stopped

  # Postgres/pgvector do PoC de memória (mem0, workflow coding_review).
  # Opcional — o serviço `adk` não depende deste (sem depends_on, de
  # propósito): ninguém precisa subir isso pra rodar o fluxo dos agentes.
  # Só é usado se AI4ES_MEMORY_USE_POSTGRES=true no .env; sobe com
  # `docker compose up memory_postgres` quando alguém quiser testar com ele.
  memory_postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=ai4es
      - POSTGRES_PASSWORD=ai4es_poc_local
      - POSTGRES_DB=ai4es_memory
    ports:
      - "5433:5432"
    volumes:
      - ai4es-memory-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  adk-venv-docker:
  copilot-tokens:
  ai4es-memory-pgdata:
