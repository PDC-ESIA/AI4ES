[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short
pythonpath = .
markers =
    integration: testes que executam ferramentas externas (ruff, bandit) — requerem instalação no ambiente
    infraestrutura: Camada 1 — testes determinísticos (unit/integração leve): schemas, tools, workspace, harness Docker, orquestração
    trajetoria: Camada 2 — validação da sequência de decisões dos agentes (trajectory evaluation), com coleta de trace estruturado
    coder_isolado: testes que exercitam exclusivamente o pipeline workflow_coding_review
    evals: Camada 3 — avaliação de qualidade com LLM real (custo de API, não roda no CI padrão)
    sandbox: Camada 4 — pipeline completo ponta-a-ponta com LLM real (custo de API, não roda no CI padrão)